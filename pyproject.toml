[project]
name = "fuzzy-solvers"
version = "0.1.0"
description = "Experiments with fuzzy/LLM-driven solvers for open combinatorial problems"
requires-python = ">=3.12"
dependencies = ["claude-agent-sdk>=0.1.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true
